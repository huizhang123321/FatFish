<?xml version="1.0" encoding="UTF-8"?>
<!--
  FatFish application mark.

  Original artwork drawn for this project: a stylised fish built from a single
  swept body shape and an eye. It shares no geometry, colour ramp or motif with
  any third-party chat product's logo.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="肥鱼聊天">
  <defs>
    <linearGradient id="fatfish-body" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#63d2ff" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="fatfish-plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a24" />
      <stop offset="100%" stop-color="#0b0e14" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#fatfish-plate)" />

  <g id="fish">
    <path
      d="M5 32c9.5-12.5 22-18 33.5-18 6.3 0 11.6 2.1 15.7 5.3L62 12l-1.2 10 1.2 10-7.8-7.3C50.1 27.9 44.8 30 38.5 30 27 30 14.5 24.5 5 32z"
      fill="url(#fatfish-body)"
    />
    <path
      d="M20 40c4 3.5 9 5.5 14 5.5"
      stroke="rgba(11,14,20,.35)"
      stroke-width="2"
      fill="none"
      stroke-linecap="round"
    />
    <circle cx="45" cy="27.4" r="2.9" fill="#0b0e14" />
  </g>
</svg>
